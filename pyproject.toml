[project]
name = "langchain-anchorbrowser"
version = "0.3.0"
description = "Anchor Browser tools for LangChain"
authors = [
    {name = "Gil Dankner",email = "gil@anchorbrowser.io"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anchorbrowser>=1.0,<2",
    "langchain-core>=1.0,<2",
    "pydantic>=2.7,<3",
]

[tool.poetry]
packages = [{include = "langchain_anchorbrowser", from = "src" }]

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
langchain = ">=1.0,<2"
langchain-tests = ">=1.0,<2"
pytest = ">=8.0,<10"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = ">=0.6"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE", "I", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The demos report each step's error and carry on with the next step.
"scripts/*.py" = ["BLE001"]
"docs/*.ipynb" = ["BLE001"]

[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0"
]
build-backend = "poetry.core.masonry.api"

[project.urls]
Homepage = "https://anchorbrowser.io"
Repository = "https://github.com/anchorbrowser/langchain-anchorbrowser"
